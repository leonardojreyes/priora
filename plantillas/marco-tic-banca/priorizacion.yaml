escala: { min: 1, max: 5, anclas_sin_justificacion: [1, 3, 5] }
bandas:
  - { clave: alta, desde: 4.0, recomendacion: priorizar_si_hay_capacidad }
  - { clave: media, desde: 3.0, recomendacion: diferir_para_refinar }
  - { clave: baja, desde: 0, recomendacion: diferir_o_rechazar }
banderas: [riesgo_regulatorio_ciber_alto, fecha_limite_externa, duplicidad, sin_sponsor, sin_dueno_funcional]

modelos:
  - clave: modelo-requerimientos
    nombre: Modelo de requerimientos
    aplica_a: { grupos: [requerimientos] }
    criterios:
      - clave: alineacion
        nombre: Alineación a objetivo estratégico
        peso: 0.25
        ancla_1: No contribuye a ningún objetivo estratégico del plan.
        ancla_3: Contribuye de forma indirecta o parcial a un objetivo estratégico.
        ancla_5: Contribuye de forma directa a un objetivo estratégico nombrado explícitamente.
        maximo_sin_objetivo: 1
      - clave: riesgo_cumplimiento
        nombre: Riesgo de no ejecutar y cumplimiento
        peso: 0.30
        ancla_1: Sin consecuencia relevante si no se atiende.
        ancla_3: "Consecuencia moderada: hallazgo de auditoría, reproceso manual o riesgo operativo acotado."
        ancla_5: Obligación normativa o de franquicia, o riesgo operacional, reputacional o de ciberseguridad alto.
      - clave: impacto
        nombre: Impacto en el cliente y en el negocio
        peso: 0.30
        ancla_1: El cliente no percibe cambio y no mejora ningún indicador interno.
        ancla_3: Mejora perceptible en un segmento, un canal o un proceso de un área.
        ancla_5: Mejora directa en un servicio crítico para el cliente o mejora significativa y medible en costo, ingreso o eficiencia.
      - clave: esfuerzo_capacidad
        nombre: Esfuerzo y capacidad
        peso: 0.15
        fuente: capacidad
        ancla_1: Esfuerzo alto para su categoría y sin capacidad disponible.
        ancla_3: Esfuerzo medio o requiere ajustar capacidad o esperar una ventana de cambio.
        ancla_5: Esfuerzo bajo y capacidad disponible ahora.
    nucleo_comun:
      alineacion: [alineacion]
      riesgo: [riesgo_cumplimiento]
      impacto: [impacto]

  - clave: modelo-proyectos
    nombre: Modelo de proyectos
    aplica_a: { grupos: [proyectos], etapas: [pre_proyecto, proyecto_propuesto, proyecto_entrada_directa] }
    valida_criterio: { alineacion: { area: planificacion-estrategica } }
    criterios:
      - clave: alineacion
        nombre: Alineación a objetivo estratégico
        peso: 0.20
        ancla_1: No contribuye a ningún objetivo estratégico del plan.
        ancla_3: Contribuye de forma indirecta o parcial a un objetivo estratégico.
        ancla_5: Contribuye de forma directa y crítica a un objetivo estratégico nombrado explícitamente.
        maximo_sin_objetivo: 1
      - clave: valor_economico
        nombre: Valor económico / eficiencia
        peso: 0.20
        ancla_1: Sin beneficio cuantificable o beneficio marginal.
        ancla_3: Beneficio estimado moderado, con ROI positivo pero no prioritario.
        ancla_5: ROI alto y cuantificado, payback corto, respaldado en la hoja de costo y retorno.
      - clave: riesgo_cumplimiento
        nombre: Riesgo de no ejecutar y cumplimiento
        peso: 0.15
        ancla_1: Sin consecuencia relevante si no se ejecuta.
        ancla_3: Consecuencia moderada si no se ejecuta.
        ancla_5: Obligación regulatoria con fecha límite, o riesgo operacional/reputacional/ciber alto.
      - clave: impacto_cliente
        nombre: Impacto en el cliente
        peso: 0.15
        ancla_1: El cliente externo no percibe ningún cambio.
        ancla_3: Mejora perceptible en un segmento o canal específico de clientes.
        ancla_5: Mejora directa en experiencia, tiempos o disponibilidad de un servicio crítico para el cliente.
      - clave: impacto_negocio
        nombre: Impacto en el negocio
        peso: 0.15
        ancla_1: Sin efecto en indicadores internos de negocio.
        ancla_3: Mejora moderada en un proceso o indicador interno de un área.
        ancla_5: Mejora significativa y medible en costos, ingresos, eficiencia o cumplimiento interno.
      - clave: viabilidad_capacidad
        nombre: Viabilidad y capacidad
        peso: 0.15
        fuente: capacidad
        ancla_1: Alta complejidad técnica y sin capacidad disponible.
        ancla_3: Complejidad media; requiere ajustar capacidad o esperar ventana de cambio.
        ancla_5: Baja complejidad y capacidad de equipo, presupuesto y ventana de cambio disponibles ahora.
    nucleo_comun:
      alineacion: [alineacion]
      riesgo: [riesgo_cumplimiento]
      impacto: [impacto_cliente, impacto_negocio]   # promedio
